name: Build MINDROLL (macOS arm64, respaldo)

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15   # Apple Silicon (respaldo si la cola de Intel está parada)
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 2>&1 | tee build.log

      - name: Compilar
        run: cmake --build build --config Release -j4 2>&1 | tee -a build.log

      - name: Empaquetar y firmar (ad-hoc)
        run: |
          ART="build/Mindroll_artefacts/Release"
          OUT="dist/MINDROLL"
          mkdir -p "$OUT"
          cp -R "$ART/VST3/MINDROLL.vst3" "$OUT/"
          cp -R "$ART/AU/MINDROLL.component" "$OUT/"
          codesign --force --deep -s - "$OUT/MINDROLL.vst3"
          codesign --force --deep -s - "$OUT/MINDROLL.component"
          cp -R "$ART/Standalone/MINDROLL.app" "$OUT/"
          codesign --force --deep -s - "$OUT/MINDROLL.app"
          cp INSTALAR.txt "$OUT/"
          cd dist && ditto -c -k --keepParent "MINDROLL" "MINDROLL-mac.zip"

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^project(Mindroll VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          gh release create "v${VER}-arm${{ github.run_number }}" "dist/MINDROLL-mac.zip" \
            --title "MINDROLL v${VER} (arm64, build ${{ github.run_number }})" \
            --notes "Descarga MINDROLL-mac.zip y sigue INSTALAR.txt (Mac Apple Silicon)."

      - name: Guardar log si falla
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log "/tmp/logs/build-${{ github.run_number }}.log" 2>/dev/null || echo "sin log" > "/tmp/logs/build-${{ github.run_number }}.log"
          tail -n 300 "/tmp/logs/build-${{ github.run_number }}.log" > /tmp/logs/latest.log
          cd /tmp/logs && git init -q && git checkout -q -b build-logs && git add . \
            && git -c user.name=mo-bot -c user.email=mo-bot@users.noreply.github.com commit -qm "log ${{ github.run_number }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs
